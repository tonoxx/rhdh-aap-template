apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aap-oauth-test
  title: AAP OAuth 連携テスト
  description: AAPTokenField で OAuth ログインし、Job Template を起動するテスト
  tags:
    - test
    - aap
spec:
  owner: user:default/tonoxx
  type: service
  parameters:
    - title: Job Template 設定
      required:
        - job_template_name
      properties:
        job_template_name:
          title: Job Template 名
          type: string
          default: "Demo Job Template"
          enum:
            - "Demo Job Template"
            - "debug-echo-azure-params"
          enumNames:
            - "Demo Job Template（Hello World）"
            - "debug-echo-azure-params（Azure パラメータ出力）"
        extra_var_message:
          title: メッセージ（extra_vars）
          type: string
          default: "Hello from RHDH"
          description: Job Template に渡す extra_vars

    - title: AAP 接続
      properties:
        aap_token:
          title: AAP アクセストークン
          type: string
          ui:field: AAPTokenField

  steps:
    - id: trigger-aap
      name: AAP Job Template を起動
      action: rhaap:launch-job-template
      input:
        token: ${{ secrets.aap_token }}
        values:
          template: ${{ parameters.job_template_name }}
          extraVariables:
            message: ${{ parameters.extra_var_message }}

  output:
    text:
      - title: 実行結果
        content: |
          AAP Job Template `${{ parameters.job_template_name }}` を起動した。
          AAP の管理画面で実行結果を確認すること。
